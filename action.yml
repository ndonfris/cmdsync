name: cmdsync
description: Regenerate (or verify) comment-delimited regions of any file from the output of the commands that declare them
author: ndonfris
branding:
  icon: file-text
  color: blue

inputs:
  mode:
    description: '`check` fails the step when a region is out of date; `write` regenerates regions in place'
    default: check
  paths:
    description: 'Space separated files/directories to process (default: the config''s `include` globs)'
    default: ''
  config:
    description: 'Path to a cmdsync.json or package.json (default: nearest one to `working-directory`)'
    default: ''
  args:
    description: Extra arguments passed to the CLI (e.g. `--shell bash --command my-cli`)
    default: ''
  working-directory:
    description: Directory to run in
    default: '.'
  node-version:
    description: 'Node.js version to set up for cmdsync (default: the runner''s Node when it''s >= 22.18, else 22). Setting up Node changes it for the rest of the job'
    default: ''

outputs:
  changed:
    description: '`true` when any region was (or, in check mode, would be) changed'
    value: ${{ steps.run.outputs.changed }}
  failed:
    description: Number of directives whose command failed
    value: ${{ steps.run.outputs.failed }}

runs:
  using: composite
  steps:
    # cmdsync needs Node >= 22.18 (it runs TypeScript natively); only set it up when the
    # runner's is older, since setup-node changes Node for the caller's later steps too
    - name: Check Node.js
      id: node
      shell: bash
      env:
        INPUT_NODE_VERSION: ${{ inputs.node-version }}
      run: |
        setup=true
        if [ -z "$INPUT_NODE_VERSION" ] && version=$(node -p 'process.versions.node' 2>/dev/null); then
          IFS=. read -r major minor _ <<< "$version"
          if (( major > 22 || (major == 22 && minor >= 18) )); then setup=false; fi
        fi
        echo "setup=$setup" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      if: steps.node.outputs.setup == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version || '22' }}

    # npm install runs `prepare`, which builds dist/ and the man page
    - name: Install cmdsync
      shell: bash
      run: npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"

    - name: Run cmdsync
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set -f
        # with "shell": "auto" (the default), run directives' commands in sh, unless the workflow says otherwise
        export CMDSYNC_SHELL="${CMDSYNC_SHELL:-sh}"
        args=()
        case "$INPUT_MODE" in
          check) args+=(--check) ;;
          write) ;;
          *) echo "::error title=cmdsync::invalid mode '$INPUT_MODE' (expected check|write)"; exit 2 ;;
        esac
        [ -n "$INPUT_CONFIG" ] && args+=(--config "$INPUT_CONFIG")
        # word-split args and paths on purpose (globbing disabled above)
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" $INPUT_ARGS $INPUT_PATHS
