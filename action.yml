name: cmdsync
description: Regenerate (or verify) comment-delimited regions of any file from the output of the commands that declare them
author: ndonfris
branding:
  icon: file-text
  color: blue

inputs:
  mode:
    description: '`check` fails the step when a region is out of date; `write` regenerates regions in place'
    default: check
  paths:
    description: Space separated files/directories to process (default: the config's `include` globs)
    default: ''
  config:
    description: Path to a cmdsync.json or package.json (default: nearest one to `working-directory`)
    default: ''
  args:
    description: Extra arguments passed to the CLI (e.g. `--shell bash --command my-cli`)
    default: ''
  working-directory:
    description: Directory to run in
    default: '.'

outputs:
  changed:
    description: '`true` when any region was (or, in check mode, would be) changed'
    value: ${{ steps.run.outputs.changed }}
  failed:
    description: Number of directives whose command failed
    value: ${{ steps.run.outputs.failed }}

runs:
  using: composite
  steps:
    - name: Install cmdsync
      shell: bash
      run: |
        npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"
        npm run --prefix "$GITHUB_ACTION_PATH" build

    - name: Run cmdsync
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set -f
        args=()
        case "$INPUT_MODE" in
          check) args+=(--check) ;;
          write) ;;
          *) echo "::error title=cmdsync::invalid mode '$INPUT_MODE' (expected check|write)"; exit 2 ;;
        esac
        [ -n "$INPUT_CONFIG" ] && args+=(--config "$INPUT_CONFIG")
        # word-split args and paths on purpose (globbing disabled above)
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" $INPUT_ARGS $INPUT_PATHS
